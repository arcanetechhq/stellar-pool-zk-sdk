name: Release dry-run

on:
  pull_request:
    paths:
      - "client-sdk/**/*"
      - "hermez-ptau"
      - "shapes.json"
      - "scripts/**/*"
      - "test/release-dry-run.mjs"
      - ".gitmodules"
      - "soroban-privacy-pools"
      - ".github/workflows/npm-bump-version.yaml"
      - ".github/workflows/npm-publish.yaml"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          lfs: false
          token: ${{ secrets.SUBMODULE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Resolve release line from base branch
        id: line
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          case "$base" in
            development) echo "release_line=0" >> "$GITHUB_OUTPUT" ;;
            v1) echo "release_line=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported pull request base branch: $base (expected development or v1)" >&2
              exit 1
              ;;
          esac
      - name: Detect whether stable 1.x is already published
        id: stable1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "@arcanetech/stellar-privacy-pool-zk-sdk" versions --json 2>/dev/null \
            | python3 -c 'import json,sys; versions=json.load(sys.stdin); sys.exit(0 if any(isinstance(v,str) and v.startswith("1.") and "-" not in v for v in versions) else 1)'; then
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            echo "published=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Rehearse release plan (dry-run)
        env:
          DRY_RUN: "1"
          RELEASE_LINE: ${{ steps.line.outputs.release_line }}
          STABLE_1X_PUBLISHED: ${{ steps.stable1.outputs.published }}
          PROMOTE_STABLE: "0"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          export COMMIT_MESSAGE
          scripts/release-dry-run.sh
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build client-sdk
        run: cd client-sdk && npm i --no-frozen-lockfile && npm run build
      - name: Verify SDK package omits proving artifacts
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          (cd client-sdk && npm pack --pack-destination "$pack_dir")
          tarball="$(find "$pack_dir" -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          if tar -tf "$tarball" | grep -E '\.(zkey|r1cs|bin|gz)$|_verification_key\.json$'; then
            echo "SDK package must not include proving or verification artifacts" >&2
            tar -tf "$tarball" >&2
            exit 1
          fi
