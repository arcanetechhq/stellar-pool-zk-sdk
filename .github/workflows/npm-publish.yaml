name: NPM Package publish

on:
  push:
    branches:
      - development
      - v1
    paths:
      - "client-sdk/**/*"
      - "hermez-ptau"
      - "shapes.json"
      - "scripts/**/*"
      - ".gitmodules"
      - "soroban-privacy-pools"
      - ".github/workflows/npm-publish.yaml"
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Promote the 1.x line to stable 1.0.0 and move latest (v1 branch only)
        type: boolean
        required: false
        default: false

jobs:
  publish-npm:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: true
          lfs: false
          token: ${{ secrets.SUBMODULE_PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Resolve release line from branch
        id: line
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            development) echo "release_line=0" >> "$GITHUB_OUTPUT" ;;
            v1) echo "release_line=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported branch for publish: $ref (expected development or v1)" >&2
              exit 1
              ;;
          esac
      - name: Guard promotion to the 1.x branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_stable }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.line.outputs.release_line }}" != "1" ]]; then
            echo "Manual promotion is only allowed on the v1 branch" >&2
            exit 1
          fi
      - name: Detect whether stable 1.x is already published
        id: stable1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! versions_json="$(npm view "@arcanetech/stellar-privacy-pool-zk-sdk" versions --json 2>/dev/null)"; then
            echo "could not read npm package versions; refusing to guess STABLE_1X_PUBLISHED" >&2
            exit 1
          fi
          if printf '%s' "$versions_json" | python3 -c 'import json,sys; versions=json.load(sys.stdin); sys.exit(0 if any(isinstance(v,str) and v.startswith("1.") and "-" not in v for v in versions) else 1)'; then
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            echo "published=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Select version with the release script
        id: release
        env:
          DRY_RUN: "0"
          RELEASE_LINE: ${{ steps.line.outputs.release_line }}
          STABLE_1X_PUBLISHED: ${{ steps.stable1.outputs.published }}
          PROMOTE_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_stable && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          if [[ "${PROMOTE_STABLE}" == "1" ]]; then
            export COMMIT_MESSAGE="chore: promote"
          else
            COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
            export COMMIT_MESSAGE
          fi
          scripts/release-dry-run.sh
          version="$(python3 -c 'import json; print(json.load(open("client-sdk/package.json"))["version"])')"
          echo "selected version ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Commit selected package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-sdk/package.json
          if git diff --cached --quiet; then
            echo "package.json already at ${VERSION}"
          else
            git commit -m "ci: release v${VERSION} [skip ci]"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
      - name: Fetch Hermez ptau
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/fetch-hermez-ptau.sh
      - name: Check CDN origin
        env:
          ZK_ARTIFACT_CDN_ORIGIN: ${{ vars.ZK_ARTIFACT_CDN_ORIGIN }}
        run: |
          set -euo pipefail
          if [[ -z "${ZK_ARTIFACT_CDN_ORIGIN}" ]]; then
            echo "GitHub Actions variable ZK_ARTIFACT_CDN_ORIGIN is required" >&2
            exit 1
          fi
      - name: Resolve per-shape rebuild vs CDN manifest
        id: zk-artifacts
        env:
          ZK_ARTIFACT_CDN_ORIGIN: ${{ vars.ZK_ARTIFACT_CDN_ORIGIN }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          ZK_BOOTSTRAP_FROM_VERSION: "0.10.0"
          PTAU_PATH: ${{ github.workspace }}/hermez-ptau/powersOfTau28_hez_final_21.ptau
          RELEASE_LINE: ${{ steps.line.outputs.release_line }}
          ZK_CIRCUITS_MANIFEST_OBJECT: ${{ steps.release.outputs.circuits_manifest }}
          ZK_PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/resolve-zk-rebuild.sh
      - name: Check Spaces credentials
        if: steps.zk-artifacts.outputs.publish_artifacts == 'true'
        env:
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in DO_SPACES_BUCKET DO_SPACES_REGION DO_SPACES_KEY DO_SPACES_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "missing GitHub Actions ${name} (variable or secret)" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Create git tag and GitHub release for artifacts
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag ${tag} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists"
          else
            prerelease_args=()
            if [[ "$VERSION" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$tag" "${prerelease_args[@]}" --title "$tag" --generate-notes
          fi
      - name: Restore proving artifacts from GitHub release
        id: restore-artifacts
        if: steps.zk-artifacts.outputs.publish_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          mkdir -p artifacts
          if [[ -n "$tag" ]]; then
            count="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [[ "${count:-0}" -gt 0 ]]; then
              gh release download "$tag" --dir artifacts --clobber
            else
              echo "release $tag has no assets yet; skip restore"
            fi
          else
            echo "no release tag; skip restore"
          fi
          rebuild="${{ steps.zk-artifacts.outputs.rebuild_stems }}"
          IFS=',' read -r -a wanted <<< "$rebuild"
          missing=0
          for stem in "${wanted[@]}"; do
            [[ -n "$stem" ]] || continue
            for name in "${stem}.graph.bin" "${stem}.r1cs.gz" "${stem}_proving_key.bin" "${stem}_verification_key.json"; do
              if [[ ! -f "artifacts/${name}" ]]; then
                missing=1
              fi
            done
          done
          if [[ "$missing" -eq 0 && -n "$rebuild" ]]; then
            echo "need_keygen=false" >> "$GITHUB_OUTPUT"
            echo "all rebuilt stem artifacts already present; skip keygen"
          else
            echo "need_keygen=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install circom
        if: steps.restore-artifacts.outputs.need_keygen == 'true'
        run: |
          cargo install --git https://github.com/iden3/circom.git
          circom --version
      - name: Install JS deps for circuit keygen
        if: steps.restore-artifacts.outputs.need_keygen == 'true'
        run: |
          npm i --no-frozen-lockfile --prefix soroban-privacy-pools
          npm i --no-save --prefix soroban-privacy-pools snarkjs
      - name: Add npm binaries to PATH
        if: steps.restore-artifacts.outputs.need_keygen == 'true'
        run: echo "${{ github.workspace }}/soroban-privacy-pools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install C++ deps for witness graphs
        if: steps.restore-artifacts.outputs.need_keygen == 'true'
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Build changed shapes
        if: steps.restore-artifacts.outputs.need_keygen == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PTAU_PATH: ${{ github.workspace }}/hermez-ptau/powersOfTau28_hez_final_21.ptau
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
          POOLS_DIR: ${{ github.workspace }}/soroban-privacy-pools
        run: |
          set -euo pipefail
          rebuild="${{ steps.zk-artifacts.outputs.rebuild_stems }}"
          IFS=',' read -r -a wanted <<< "$rebuild"
          while IFS=$'\t' read -r shape_id kind stem; do
            for item in "${wanted[@]}"; do
              if [[ "$item" == "$stem" ]]; then
                echo "BEGIN build $stem ($shape_id $kind)"
                ./scripts/build-shape.sh "$shape_id" "$kind"
                echo "END build $stem"
              fi
            done
          done < <(./scripts/zk-shape-stems.sh)
      - name: Upload ZK artifacts to the GitHub release
        if: steps.zk-artifacts.outputs.publish_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/upload-zk-release-assets.sh "${{ steps.tag.outputs.tag }}"
      - name: Upload proving artifacts to DigitalOcean Spaces
        if: steps.zk-artifacts.outputs.publish_artifacts == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          RELEASE_LINE: ${{ steps.line.outputs.release_line }}
          ZK_CIRCUITS_MANIFEST_OBJECT: ${{ steps.release.outputs.circuits_manifest }}
        run: |
          ZK_SUBMODULE_COMMIT="$(git -C soroban-privacy-pools rev-parse HEAD)"
          export ZK_SUBMODULE_COMMIT
          scripts/upload-zk-spaces-assets.sh
      - name: Build client-sdk
        env:
          ZK_ARTIFACT_CDN_ORIGIN: ${{ vars.ZK_ARTIFACT_CDN_ORIGIN }}
        run: |
          set -euo pipefail
          cd client-sdk && npm i --no-frozen-lockfile && npm run build
      - name: Verify SDK embeds per-stem CDN mapping and omits proving artifacts
        env:
          ZK_ARTIFACT_CDN_ORIGIN: ${{ vars.ZK_ARTIFACT_CDN_ORIGIN }}
        run: |
          set -euo pipefail
          origin="${ZK_ARTIFACT_CDN_ORIGIN%/}"
          dist_js=(client-sdk/dist/index.mjs client-sdk/dist/index.node.mjs)
          if grep -RF '__ZK_ARTIFACT_CDN_ORIGIN__' "${dist_js[@]}"; then
            echo "SDK build left the CDN origin placeholder in place" >&2
            exit 1
          fi
          if grep -RF '__ZK_CIRCUITS_MANIFEST_JSON__' "${dist_js[@]}"; then
            echo "SDK build left the circuits manifest placeholder in place" >&2
            exit 1
          fi
          if grep -RF '__ZK_DEFAULT_ARTIFACT_BASE_URL__' "${dist_js[@]}"; then
            echo "SDK build left the default CDN URL placeholder in place" >&2
            exit 1
          fi
          if ! grep -Fq "${origin}/stellar/" "${dist_js[@]}"; then
            echo "SDK build did not embed ${origin}/stellar/" >&2
            grep -n "stellar" "${dist_js[@]}" >&2 || true
            exit 1
          fi
          pack_dir="$(mktemp -d)"
          (cd client-sdk && npm pack --pack-destination "$pack_dir")
          tarball="$(find "$pack_dir" -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          if tar -tf "$tarball" | grep -E '\.(zkey|r1cs|bin|gz)$|_verification_key\.json$'; then
            echo "SDK package must not include proving or verification artifacts" >&2
            tar -tf "$tarball" >&2
            exit 1
          fi
      - name: Publish client-sdk with planned dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAGS: ${{ steps.release.outputs.dist_tags }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${DIST_TAGS}" ]]; then
            echo "release script did not produce dist-tags" >&2
            exit 1
          fi
          read -r -a tags <<< "${DIST_TAGS}"
          primary="${tags[0]}"
          cd client-sdk
          npm publish --access public --tag "$primary"
          pkg="$(python3 -c 'import json; print(json.load(open("package.json"))["name"])')"
          for tag in "${tags[@]:1}"; do
            npm dist-tag add "${pkg}@${VERSION}" "$tag"
          done
